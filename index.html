<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rechner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: 'Courier New', monospace;
  }

  .card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 48px 40px;
    width: 340px;
    box-shadow: 0 0 40px rgba(15, 52, 96, 0.6);
  }

  .label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a90d9;
    margin-bottom: 24px;
  }

  .formula {
    font-size: 13px;
    color: #6b7db3;
    margin-bottom: 32px;
    padding: 12px 14px;
    background: #0d1b2a;
    border-left: 2px solid #0f3460;
    line-height: 1.6;
  }

  .formula span {
    color: #4a90d9;
    font-weight: bold;
  }

  input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 22px;
    font-family: 'Courier New', monospace;
    background: #0d1b2a;
    border: 1px solid #0f3460;
    border-radius: 2px;
    color: #e0e8ff;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
  }

  input[type="number"]:focus {
    border-color: #4a90d9;
  }

  .divider {
    height: 1px;
    background: #0f3460;
    margin: 28px 0;
  }

  .result-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a90d9;
    margin-bottom: 12px;
  }

  .result-value {
    font-size: 48px;
    color: #e0e8ff;
    letter-spacing: -1px;
    min-height: 58px;
    transition: color 0.2s;
  }

  .result-value.active {
    color: #7ec8e3;
  }

  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: #3a4a6b;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="label">Kalkulation</div>
  <div class="formula">
    Ergebnis = <span>0.65 × A</span> ÷ 140<br>
    → gerundet auf 0.5
  </div>

  <input
    type="number"
    id="inputA"
    placeholder="A eingeben"
    step="any"
    oninput="calculate()"
  />

  <div class="divider"></div>

  <div class="result-label">Ergebnis</div>
  <div class="result-value" id="result">—</div>
  <div class="hint" id="hint"></div>
</div>

<script>
  function calculate() {
    const a = parseFloat(document.getElementById('inputA').value);
    const resultEl = document.getElementById('result');
    const hintEl = document.getElementById('hint');

    if (isNaN(a)) {
      resultEl.textContent = '—';
      resultEl.classList.remove('active');
      hintEl.textContent = '';
      return;
    }

    const raw = (0.65 * a) / 140;
    // Round to nearest 0.5 (half rounds up)
    const rounded = Math.round(raw / 0.5) * 0.5;

    resultEl.textContent = rounded % 1 === 0
      ? rounded.toFixed(1)
      : rounded.toString();
    resultEl.classList.add('active');
    hintEl.textContent = 'Rohwert: ' + raw.toFixed(4);
  }

  document.getElementById('inputA').focus();
</script>
</body>
</html>
