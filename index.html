<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>CH / JP Rechner</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1a2e;
  font-family: "Courier New", monospace;
}

.card {
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 4px;
  padding: 40px 36px;
  width: 340px;
  max-width: calc(100vw - 30px);
  box-shadow: 0 0 40px rgba(15,52,96,0.6);
}

.title {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #4a90d9;
  margin-bottom: 24px;
}

.formulas {
  margin-bottom: 28px;
}

.formula-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.market {
  width: 24px;
  font-size: 12px;
  font-weight: bold;
  color: #4a90d9;
}

.market.jp {
  color: #7ec8e3;
}

.formula-text {
  font-size: 12px;
  color: #6b7db3;
}

.param {
  font-family: "Courier New", monospace;
  background: #0d1b2a;
  border: 1px solid #0f3460;
  border-radius: 2px;
  color: #e0e8ff;
  outline: none;
  padding: 6px 8px;
  font-size: 14px;
  text-align: center;
}

.multiplier {
  width: 65px;
}

.divisor {
  width: 75px;
}

.param:focus,
.main-input:focus {
  border-color: #4a90d9;
}

input[type="number"] {
  -moz-appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.hint {
  margin-top: 10px;
  font-size: 11px;
  color: #3a4a6b;
}

.main-input {
  width: 100%;
  padding: 14px 16px;
  font-size: 22px;
  font-family: "Courier New", monospace;
  background: #0d1b2a;
  border: 1px solid #0f3460;
  border-radius: 2px;
  color: #e0e8ff;
  outline: none;
}

.divider {
  height: 1px;
  background: #0f3460;
  margin: 24px 0;
}

.small-divider {
  height: 1px;
  background: #0f3460;
  margin-bottom: 24px;
}

.result-section {
  margin-bottom: 24px;
}

.result-label {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #4a90d9;
  margin-bottom: 8px;
}

.result-label.jp {
  color: #7ec8e3;
}

.result-value {
  font-size: 48px;
  color: #e0e8ff;
  letter-spacing: -1px;
}

.result-value.active {
  color: #7ec8e3;
}

.jp-line {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.jp200 {
  font-size: 20px;
  color: #4a90d9;
}

.raw {
  margin-top: 4px;
  font-size: 11px;
  color: #3a4a6b;
}
</style>
</head>

<body>

<div class="card">

  <div class="title">Kalkulation</div>

  <div class="formulas">

    <div class="formula-row">
      <span class="market">CH</span>
      <span class="formula-text">=</span>

      <input
        id="chMul"
        class="param multiplier"
        type="number"
        value="0.5"
        step="any"
      >

      <span class="formula-text">× A ÷</span>

      <input
        id="chDiv"
        class="param divisor"
        type="number"
        value="145"
        step="any"
      >
    </div>

    <div class="formula-row">
      <span class="market jp">JP</span>
      <span class="formula-text">=</span>

      <input
        id="jpMul"
        class="param multiplier"
        type="number"
        value="0.5"
        step="any"
      >

      <span class="formula-text">× A ÷</span>

      <input
        id="jpDiv"
        class="param divisor"
        type="number"
        value="665"
        step="any"
      >
    </div>

    <div class="hint">
      → gerundet auf 0.5
    </div>

  </div>

  <input
    id="inputA"
    class="main-input"
    type="number"
    placeholder="A eingeben"
    step="any"
  >

  <div class="divider"></div>

  <div class="result-section">

    <div class="result-label">
      CH
    </div>

    <div
      class="result-value"
      id="chResult"
    >
      —
    </div>

    <div
      class="raw"
      id="chRaw"
    ></div>

  </div>

  <div class="small-divider"></div>

  <div>

    <div class="result-label jp">
      JP
    </div>

    <div class="jp-line">

      <div
        class="result-value"
        id="jpResult"
      >
        —
      </div>

      <div
        class="jp200"
        id="jp200"
      ></div>

    </div>

    <div
      class="raw"
      id="jpRaw"
    ></div>

  </div>

</div>

<script>

const inputA =
  document.getElementById("inputA");

const chMulInput =
  document.getElementById("chMul");

const chDivInput =
  document.getElementById("chDiv");

const jpMulInput =
  document.getElementById("jpMul");

const jpDivInput =
  document.getElementById("jpDiv");

const chResult =
  document.getElementById("chResult");

const jpResult =
  document.getElementById("jpResult");

const chRawEl =
  document.getElementById("chRaw");

const jpRawEl =
  document.getElementById("jpRaw");

const jp200El =
  document.getElementById("jp200");


function round05(value) {
  return Math.round(value / 0.5) * 0.5;
}


function formatResult(value) {

  if (value === null) {
    return "—";
  }

  return value % 1 === 0
    ? value.toFixed(1)
    : value.toString();
}


function loadSettings() {

  const settings = [
    ["chMul", chMulInput],
    ["chDiv", chDivInput],
    ["jpMul", jpMulInput],
    ["jpDiv", jpDivInput]
  ];

  settings.forEach(([key, input]) => {

    const saved =
      parseFloat(localStorage.getItem(key));

    if (!isNaN(saved) && saved > 0) {
      input.value = saved;
    }

  });
}


function saveSettings() {

  const settings = [
    ["chMul", chMulInput],
    ["chDiv", chDivInput],
    ["jpMul", jpMulInput],
    ["jpDiv", jpDivInput]
  ];

  settings.forEach(([key, input]) => {

    const value =
      parseFloat(input.value);

    if (!isNaN(value) && value > 0) {
      localStorage.setItem(key, value);
    }

  });

  calculate();
}


function calculate() {

  const a =
    parseFloat(inputA.value);

  const chMul =
    parseFloat(chMulInput.value);

  const chDiv =
    parseFloat(chDivInput.value);

  const jpMul =
    parseFloat(jpMulInput.value);

  const jpDiv =
    parseFloat(jpDivInput.value);


  if (isNaN(a)) {

    chResult.textContent = "—";
    jpResult.textContent = "—";

    chResult.classList.remove("active");
    jpResult.classList.remove("active");

    chRawEl.textContent = "";
    jpRawEl.textContent = "";
    jp200El.textContent = "";

    return;
  }


  if (
    isNaN(chMul) ||
    isNaN(chDiv) ||
    isNaN(jpMul) ||
    isNaN(jpDiv) ||
    chDiv <= 0 ||
    jpDiv <= 0
  ) {
    return;
  }


  const chRaw =
    (chMul * a) / chDiv;

  const jpRaw =
    (jpMul * a) / jpDiv;


  const ch =
    round05(chRaw);

  const jp =
    round05(jpRaw);


  const jp200 =
    jp * 200;


  chResult.textContent =
    formatResult(ch);

  jpResult.textContent =
    formatResult(jp);


  jp200El.textContent =
    "(" +
    (
      jp200 % 1 === 0
        ? jp200.toFixed(0)
        : jp200
    )
    + ")";


  chRawEl.textContent =
    "Rohwert: " +
    chRaw.toFixed(4);

  jpRawEl.textContent =
    "Rohwert: " +
    jpRaw.toFixed(4);


  chResult.classList.add("active");
  jpResult.classList.add("active");
}


inputA.addEventListener(
  "input",
  calculate
);


[
  chMulInput,
  chDivInput,
  jpMulInput,
  jpDivInput
].forEach(input => {

  input.addEventListener(
    "change",
    saveSettings
  );

});


loadSettings();

</script>

</body>
</html>
